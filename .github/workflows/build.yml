name: Build ImmortalWrt HY3000

on:
  workflow_dispatch:
    inputs:
      with_docker:
        description: 'Include Docker support'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # UTC 18:23 = 北京时间 02:23（避开整点，GitHub 定时任务高峰期会延迟）
    - cron: '23 18 * * *'

# 上游 immortalwrt/immortalwrt 无法向 fork 发通知，改为定时轮询：
# check-upstream 比对上游 HEAD 与 .upstream-sha 记录，有变化才触发构建
concurrency:
  group: build-immortalwrt-hy3000
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      build_needed: ${{ steps.check.outputs.build_needed }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Compare upstream openwrt-25.12 HEAD with .upstream-sha
        id: check
        run: |
          UPSTREAM_SHA=$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | cut -f1)
          STORED_SHA=$(cat .upstream-sha 2>/dev/null || true)
          echo "upstream: $UPSTREAM_SHA"
          echo "stored:   ${STORED_SHA:-<none>}"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          if [ -n "$STORED_SHA" ] && [ "$UPSTREAM_SHA" = "$STORED_SHA" ]; then
            echo "Upstream unchanged — skipping build."
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream changed — build needed."
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.build_needed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev \
            libtool llvm lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch \
            pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync \
            scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget \
            xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Clone ImmortalWrt source
        run: |
          df -hT $PWD
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
          echo "Source cloned."

      - name: Run diy-part1.sh (before feeds)
        run: |
          chmod +x diy-part1.sh
          cd openwrt
          $GITHUB_WORKSPACE/diy-part1.sh

      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add daed package (not in ImmortalWrt feeds)
        run: |
          cd openwrt
          git clone --depth=1 https://github.com/QiuSimons/luci-app-daed.git package/dae

      - name: Add HY3000 device support (add-hy3000.sh)
        run: |
          chmod +x add-hy3000.sh
          bash add-hy3000.sh openwrt "$GITHUB_WORKSPACE/patches"
          # Set default hostname
          sed -i 's/ImmortalWrt/HY3000/g' openwrt/package/base-files/files/bin/config_generate

      - name: Load .config
        run: |
          cp .config openwrt/.config
          if [ "${{ github.event.inputs.with_docker }}" = "true" ]; then
            echo "CONFIG_PACKAGE_dockerd=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> openwrt/.config
            echo "CONFIG_PACKAGE_docker-compose=y" >> openwrt/.config
          fi
          cd openwrt
          make defconfig
          grep -q "CONFIG_TARGET_mediatek_filogic_DEVICE_philips_hy3000=y" .config || {
            echo "### ERROR: philips_hy3000 missing from final .config — device patches did not apply!"
            exit 1
          }
          echo "=== Final config (key items) ==="
          grep -E "BTF|BPF|dae|veth|philips|ROOTFS_PARTSIZE" .config || true

      - name: Download packages
        run: |
          cd openwrt
          for i in 1 2 3; do
            if make download -j$(nproc); then
              find dl -size -1024c -exec rm -f {} \;
              echo "Download complete (attempt $i)."
              exit 0
            fi
            echo "### Download attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "### Downloads failed after 3 attempts."
          exit 1

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          echo "Compiling with $(nproc) threads..."
          if ! make -j$(nproc) > build.log 2>&1; then
            echo "### Parallel build failed — last 30 lines of build.log:"
            tail -30 build.log || true
            echo ""
            echo "### Retrying with make -j1 V=s (single-threaded, verbose)..."
            if make -j1 V=s > build-vs.log 2>&1; then
              echo "### Single-threaded retry succeeded."
            else
              echo "### Build still failing — last 150 lines of build-vs.log:"
              tail -150 build-vs.log || true
              exit 1
            fi
          fi
          echo "status=success" >> $GITHUB_OUTPUT
          echo "=== Output files ==="
          ls -lh bin/targets/mediatek/filogic/

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            openwrt/build.log
            openwrt/build-vs.log
          if-no-files-found: ignore

      - name: Organize output
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/mediatek/filogic/
          # Keep only important files
          rm -f packages sha256sums *.buildinfo *.manifest
          echo "=== Firmware files ==="
          ls -lh

      - name: Generate release tag
        id: tag
        run: |
          echo "tag=hy3000-$(date +"%Y%m%d-%H%M")" >> $GITHUB_OUTPUT
          echo "date=$(date +"%Y-%m-%d %H:%M")" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        if: steps.compile.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "HY3000 ImmortalWrt 25.12 (${{ steps.tag.outputs.date }})"
          body: |
            ## Philips HY3000 - ImmortalWrt 25.12 with BTF/dae support

            **Features:**
            - ImmortalWrt 25.12 (kernel 6.12)
            - BTF/eBPF enabled for dae support
            - daed + luci-app-daed pre-installed
            - WiFi MT7915E (2.4G + 5G)
            - eMMC boot

            **Flash guide:**
            1. Download `*-recovery.itb` for initial install via TFTP
            2. Download `*-sysupgrade.itb` for upgrading from existing ImmortalWrt/iStoreOS
          files: openwrt/bin/targets/mediatek/filogic/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload firmware as artifact (backup)
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-hy3000-firmware
          path: openwrt/bin/targets/mediatek/filogic/

      - name: Record upstream SHA for next comparison
        if: success()
        env:
          UPSTREAM_SHA: ${{ needs.check-upstream.outputs.upstream_sha }}
        run: |
          echo "$UPSTREAM_SHA" > .upstream-sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .upstream-sha
          git diff --cached --quiet && echo "SHA unchanged, nothing to record." && exit 0
          git commit -m "ci: track immortalwrt openwrt-25.12 @ ${UPSTREAM_SHA:0:12} [skip ci]"
          # main may have moved during the ~3h build; rebase so this step
          # can't fail after the firmware was already released
          git pull --rebase --autostash
          git push
